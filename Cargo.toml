# The root crate is the CLI half: flag parsing, the extraction driver, the HTTP
# server, the static exporter, page composition. It stays at the repo root
# because three compile-time contracts are anchored there — page.rs and
# serve.rs resolve dist/app, scripts/bundle-app.ts and web/ through
# env!("CARGO_MANIFEST_DIR"), and the devShell shim runs `cargo run
# --manifest-path $root/Cargo.toml`. Putting the extraction crate under
# crates/ instead of this one costs nothing and breaks none of them.
[workspace]
members = ["crates/extract"]
# Cargo's default for a workspace whose root is itself a package is to select
# only the root package, so a bare `cargo test` / `clippy` / `llvm-cov test`
# would quietly stop compiling and running the extraction crate's unit tests —
# 26 of the workspace's 32. Spelled out here rather than as --workspace flags
# so every existing invocation (crane's checks, CI's out-of-sandbox coverage
# run, a plain local `cargo test`) keeps covering both crates unchanged.
default-members = [".", "crates/extract"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"

# Panic-capable code is banned outright: no unwrap/expect/indexing/unchecked
# arithmetic anywhere, with pedantic and nursery denied underneath (priority -1
# so the named lints stay authoritative over the group levels).
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

# One version list for both crates. Two dependency tables are two places for
# serde or tree-sitter to drift into two copies of themselves in one binary.
[workspace.dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fancy-regex = "0.14"
futures = "0.3.33"
hex = "0.4"
indexmap = { version = "2.14.0", features = ["serde"] }
notify = "8.2.0"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
streaming-iterator = "0.1.9"
tokio = "1"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.23"
tree-sitter-nix = "0.3"

[package]
name = "flake-explorer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interactive visualizer for Nix flakes: outputs/module tree, option provenance, file map"

# No build.rs here any more: the fingerprint build script moved to the
# extraction crate, which is the tree it hashes. sha2/hex/chrono/tree-sitter
# and the rest of the extractor's deps went with it.
[dependencies]
flake-explorer-extract = { path = "crates/extract", version = "0.7.0" }
anyhow.workspace = true
axum.workspace = true
futures.workspace = true
indexmap.workspace = true
notify.workspace = true
percent-encoding.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "process",
  "fs",
  "net",
  "sync",
  "time",
  "io-util",
  "signal",
] }
tokio-stream.workspace = true

[profile.release]
# Thin, not fat. Once the checks moved to the dev profile and buildPackage
# stopped re-running the suite, exactly one artifact in CI is LTO-linked: the
# shipped binary. Relinking it after a one-line change is 14.1s thin against
# 38.0s fat, uncontended on aarch64-darwin. Fat's remaining edge is size —
# 6.4M against 8.2M, carried by every npm platform package — and the
# cross-crate inlining behind it is worth little to a tool that spends its
# life blocked on `nix` rather than in its own hot loops.
#
# Thin was the better call even before those two changes (61.7s of compile
# against 72.7s across build+test), but only barely; it is 2.7x now.
lto = "thin"

[lints]
workspace = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
