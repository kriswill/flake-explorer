# Publish a static export of this repo's own flake to GitHub Pages: the
# explorer UI + manifest + sources materialized into one standalone
# flake.html (index.html is a copy so the site root works).
#
# One-time repo setup: Settings → Pages → Source = "GitHub Actions".

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let an in-flight one finish (GitHub's
# recommendation for Pages, so a live deploy is never cancelled mid-way).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # FlakeHub Cache credential (see ci.yml) — without it the build still
      # runs, just cold.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The export shells out to nix for the manifest + source resolution;
      # Determinate Nix + FlakeHub cache also make `nix run .#` cheap (the
      # binary and its dep layer come from the cache pushed by CI).
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@77c6bddd7d747943530aaa578c57f233ee5d920e # main 2026-07
      - run: bun install --frozen-lockfile
      # This flake has no nixos/darwin configurations, so --all/--sources all
      # cost nothing today; they keep the demo complete if that changes.
      # --graphs embeds the main package's dependency graph (~1,500 nodes,
      # ~0.5 MB) so the demo shows the graph views; graphs are explicit-only,
      # never implied by --all. Presence in the embedded graph is a snapshot
      # of the CI runner's store — the legend dates it, honestly.
      - run: |
          mkdir -p dist/site
          nix run .# -- export . --all --sources all \
            --graphs packages/x86_64-linux/default \
            --html dist/site/flake.html
          cp dist/site/flake.html dist/site/index.html
      # Docs: curated pages + TypeDoc API reference (markdown), both rendered
      # through the shared theme template into dist/site/docs/.
      - run: bun run docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
