# Inputs mirror flake.nix, pinned to the exact revs flake.lock has locked —
# flake.lock is the single source of truth. Don't edit the `url:` pins or run
# a bare `devenv update` by hand: scripts/sync-devenv-lock.ts rewrites the
# pins and regenerates devenv.lock (CI's `devenv` job enforces parity).
# treefmt-nix feeds the same `treefmt` wrapper the flake's `nix fmt` uses.
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/104240a772428cc2e20d8fd86c9ddbb886bbaff2
  treefmt-nix:
    url: github:numtide/treefmt-nix/d1187f8bc71fb8aab02395869ec3f5c1920f75c0
    inputs:
      nixpkgs:
        follows: nixpkgs
