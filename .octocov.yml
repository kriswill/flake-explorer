# SPA test-suite coverage. The stored baseline on main predates the
# extractor/server moving out of the TS corpus (its coverage now lives in
# the cargo report, .octocov.rust.yml), so a `current >= prev` ratchet would
# compare against a differently-shaped denominator — a fixed floor holds the
# line instead. Once a post-restructure baseline lands on main, the ratchet
# can return.
#
# This is the unkeyed report, so its title stays the bare "Code Metrics
# Report" and its artifact keeps the default `octocov-report` name — the
# `message:` line below is what tells a reader which suite they are looking
# at. Giving this one a `repository:` key the way .octocov.rust.yml does
# would rename its artifact and orphan main's baseline for no gain.
coverage:
  paths:
    - dist/coverage/lcov.info
  acceptable: 96%
diff:
  if: is_pull_request
  datastores:
    - artifact://${GITHUB_REPOSITORY}
# No `comment:`. octocov renders one report per run and would post it as its
# own comment; the PR gets a single comment carrying both suites instead,
# composed by the `build` job from what `summary:` renders here. See
# docs/build-and-infra.md.
summary:
  if: true
  # One attribution footer is added once to the composed comment, so each
  # section suppresses its own.
  hideFooterLink: true
  message: "**SPA test suite** — `bun test --coverage`, floor 96%."
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
